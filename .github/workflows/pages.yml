name: Deploy Chess Arena to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Bundle Stockfish for same-origin hosting
        run: |
          mkdir -p /tmp/stockfish-package engine
          npm pack stockfish@19.0.1 --pack-destination /tmp
          tar -xzf /tmp/stockfish-19.0.1.tgz -C /tmp/stockfish-package
          cp /tmp/stockfish-package/package/bin/stockfish-19-lite-single.js engine/
          cp /tmp/stockfish-package/package/bin/stockfish-19-lite-single.wasm engine/
          cp /tmp/stockfish-package/package/Copying.txt engine/
      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
